<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#F4F7FA;color:#102C53;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.logo{position:absolute;left:64px;top:56px;height:84px}
.date{position:absolute;right:64px;top:74px;font-weight:800;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#0091BA;border:3px solid #0091BA;border-radius:40px;padding:10px 22px}
h1{position:absolute;left:64px;right:64px;top:190px;font-family:'Inter Display',Inter,sans-serif;font-weight:900;font-size:92px;line-height:.98;letter-spacing:-.03em}
h1 span{color:#E8641B}
.art{position:absolute;left:0;top:410px;width:1080px;height:560px}
.callout{position:absolute;left:64px;right:64px;top:965px;background:#102C53;color:#fff;border-radius:24px;padding:36px 44px;display:flex;align-items:center;gap:34px}
.callout .k{font-weight:900;font-size:30px;letter-spacing:.1em;text-transform:uppercase;color:#FFB15C;flex:0 0 auto;line-height:1.1}
.callout .v{font-weight:800;font-size:44px;line-height:1.1}
.foot{position:absolute;left:64px;right:64px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:26px;color:#5B6B7D}
.foot b{color:#102C53;font-size:40px;font-weight:900}
.foot img{height:86px}
.mfoot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#0091BA;background-image:repeating-linear-gradient(115deg,transparent 0 60px,#ffffff10 60px 72px);display:flex;align-items:center;justify-content:space-between;padding:0 72px;font-family:Inter,sans-serif}
.mfoot .l{font-weight:800;font-size:27px;color:#fff;line-height:1.2;padding-left:150px}.mfoot .l small{display:block;font-weight:600;font-size:23px;color:#CDEFFA}
.mfoot .r{text-align:right;color:#fff;font-weight:900;font-size:50px;white-space:nowrap}.mfoot .r small{display:block;font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#CDEFFA}
.mbadge{position:absolute;left:66px;bottom:20px;height:130px;z-index:3}
</style></head><body>
<img class="logo" src="../../brand/wordmark_color.png">
<h1>The busiest day of the year for kitchen fires? <span>Thanksgiving.</span></h1>
<svg class="art" viewBox="0 0 1080 560">
 <defs><radialGradient id="g" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#FFD6A8"/><stop offset="1" stop-color="#F4F7FA" stop-opacity="0"/></radialGradient></defs>
 <circle cx="540" cy="300" r="300" fill="url(#g)"/>
 <!-- big pan -->
 <ellipse cx="500" cy="430" rx="300" ry="54" fill="#2E3E52"/>
 <ellipse cx="500" cy="414" rx="300" ry="54" fill="#5C7189"/>
 <ellipse cx="500" cy="408" rx="262" ry="40" fill="#3A4B60"/>
 <rect x="790" y="396" width="250" height="34" rx="17" fill="#2E3E52"/>
 <!-- flames -->
 <path d="M320 410 C290 300 380 260 360 150 C430 210 450 280 440 330 C470 300 478 250 470 210 C540 270 560 340 540 410 Z" fill="#E8641B"/>
 <path d="M470 410 C450 320 520 280 510 120 C600 200 640 300 620 350 C650 320 662 270 654 230 C720 300 730 370 700 410 Z" fill="#F07C2A"/>
 <path d="M380 410 C370 350 410 330 404 270 C450 310 460 360 450 410 Z" fill="#FFC23D"/>
 <path d="M540 410 C530 340 580 310 574 230 C630 290 640 360 620 410 Z" fill="#FFC23D"/>
 <!-- lid coming down -->
 <g transform="translate(560,40) rotate(-10)"><ellipse cx="200" cy="70" rx="220" ry="40" fill="#0091BA"/><ellipse cx="200" cy="60" rx="220" ry="40" fill="#2BB3E0"/><rect x="170" y="10" width="60" height="36" rx="12" fill="#102C53"/></g>
 <g fill="none" stroke="#0091BA" stroke-width="8" stroke-linecap="round"><path d="M770 160 v60 M750 200 l20 20 20-20"/></g>
 <!-- crossed water drop -->
 <g transform="translate(120,90)"><circle cx="70" cy="70" r="70" fill="#fff" stroke="#D93B3B" stroke-width="10"/><path d="M70 30 C52 60 42 78 42 92 a28 28 0 0 0 56 0 c0-14-10-32-28-62z" fill="#2BB3E0"/><path d="M22 118 L118 22" stroke="#D93B3B" stroke-width="12"/></g>
</svg>
<div class="callout"><div class="k">Grease<br>fire?</div><div class="v">Slide a lid on. Turn off the heat. Never use water.</div></div>

</body></html>
